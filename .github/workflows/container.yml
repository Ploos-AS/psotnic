name: Container

on:
  pull_request:
  push:
    branches:
      - main
      - 'release/**'
    tags:
      - 'v*'

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Static validation
        run: sh tests/static.sh
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: psotnic:test
          platforms: linux/amd64
      - name: Smoke test
        run: IMAGE=psotnic:test sh scripts/smoke-test.sh
      - name: Runtime qualification
        run: IMAGE=psotnic:test sh tests/runtime.sh

  publish-edge-or-tag:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ploos-as/psotnic
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

  publish-release-candidate:
    if: startsWith(github.ref, 'refs/heads/release/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Validate release branch
        id: release
        shell: bash
        run: |
          set -euo pipefail
          branch=${GITHUB_REF_NAME#release/v}
          version=$(cat VERSION)
          test "$branch" = "$version"
          test -f "docs/releases/v${version}.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/ploos-as/psotnic:${{ steps.release.outputs.version }}
            ghcr.io/ploos-as/psotnic:${{ steps.release.outputs.minor }}
            ghcr.io/ploos-as/psotnic:latest
          provenance: mode=max
          sbom: true
