services:
  psotnic:
    image: ghcr.io/ploos-as/psotnic:0.1.1
    container_name: psotnic
    user: "1000:1000"
    environment:
      PSOTNIC_CONFIG: /data/psotnic.conf
    volumes:
      - psotnic-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  psotnic-data:
